<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- SEO Title -->
    <title>
      YouTube to MP3 Converter – Free, Fast & Ad-Free | HowToMp3
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="ClearAudio is a fast, simple and ad-free YouTube to MP3 converter. Convert supported YouTube videos to high-quality MP3 audio online."
    />
    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Author -->
    <meta
      name="author"
      content="ClearAudio"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#ff1744"
    />

    <!-- Canonical -->
    <!-- Replace YOUR-DOMAIN.com with your real domain after deployment -->
    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="ClearAudio"
    />

    <meta
      property="og:title"
      content="YouTube to MP3 Converter – ClearAudio"
    />

    <meta
      property="og:description"
      content="Convert supported YouTube videos to high-quality MP3 audio with ClearAudio. Fast, simple and ad-free."
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <!-- Add this when you create a social preview image -->
    <!--
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/og-image.png"
    />
    -->

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="YouTube to MP3 Converter – ClearAudio"
    />

    <meta
      name="twitter:description"
      content="Fast, simple and ad-free YouTube to MP3 conversion with ClearAudio."
    />

    <!-- Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ClearAudio",
        "url": "https://YOUR-DOMAIN.com/",
        "description": "ClearAudio is a fast, simple and ad-free YouTube to MP3 converter.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
